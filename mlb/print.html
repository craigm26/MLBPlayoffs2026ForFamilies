<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Print a Bracket — MLB Playoffs 2026</title>
<link rel="stylesheet" href="fonts/fredoka.css" />
<style id="custom-style"></style>
<style id="page-style">@page { size: letter landscape; margin: 0.3in; }</style>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Fredoka', sans-serif; background: #0f2240; color: #fff; }
  .bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 14px 20px; background: #163766; position: sticky; top: 0; z-index: 2; }
  .bar a { color: #f4b740; text-decoration: none; font-weight: 600; }
  .group { display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,.08); border-radius: 12px; padding: 5px 8px; }
  .group b { font-size: 13px; color: #9fb0d8; margin-right: 4px; }
  .group button, .go { border: none; border-radius: 9px; padding: 8px 12px; font: inherit; font-size: 15px; cursor: pointer; background: rgba(255,255,255,.12); color: #fff; }
  .group button.on { background: #f4b740; color: #0e1f3d; font-weight: 700; }
  select { font: inherit; font-size: 15px; border-radius: 9px; padding: 6px 8px; }
  .go { background: #34c77b; color: #0e1f3d; font-weight: 700; font-size: 17px; padding: 10px 18px; margin-left: auto; }
  .page2 { margin-top: 24px; }
  /* tiled poster sheets (landscape Letter, printed edge-to-edge at 100%) */
  .tile-page { position: relative; width: 11in; height: 8.5in; background: #fff; color: #111; margin: 0 auto 24px; box-shadow: 0 6px 30px rgba(0,0,0,.5); overflow: hidden; font-family: 'Fredoka', sans-serif; }
  .tp-svg { position: absolute; top: 0.55in; display: block; }
  .tp-head { position: absolute; top: 0.28in; left: 0.6in; right: 1.6in; font-size: 10pt; color: #444; }
  .tp-name { position: absolute; top: 0.18in; right: 0.45in; font-size: 22pt; font-weight: 700; color: #d33; }
  .tp-foot { position: absolute; bottom: 0.35in; left: 0.6in; right: 0.6in; font-size: 9.5pt; color: #444; }
  .guide .tp-in { padding: 0.45in 0.6in; }
  .tp-title { font-size: 18pt; font-weight: 700; color: #1c3563; text-align: center; }
  .tp-steps { font-size: 11pt; line-height: 1.4; margin: 0.08in 0 0; padding-left: 0.3in; }
  .tip { width: 100%; font-size: 13.5px; color: #cdd9ff; }
  .stage { padding: 20px; display: grid; place-items: center; }
  .sheet { background: #fff; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
  .sheet svg { display: block; width: 100%; height: 100%; }
  .sheet.letter.wide { width: min(96vw, 1100px); aspect-ratio: 11 / 8.5; }
  .sheet.letter.tall { width: min(70vw, 720px); aspect-ratio: 8.5 / 11; }
  .sheet.poster.wide { width: min(96vw, 1200px); aspect-ratio: 1200 / 927; }
  .sheet.poster.tall { width: min(70vw, 760px); aspect-ratio: 927 / 1200; }
  @media print {
    /* the pi-nas Family Bar (nav.js) injects itself into every page; keep it off the paper */
    body > *:not(.stage):not(script):not(style) { display: none !important; }
    html, body { background: #fff; padding: 0 !important; margin: 0 !important; }
    .bar { display: none; }
    .stage { padding: 0; display: block; }
    .page2 { margin-top: 0; break-before: page; page-break-before: always; }
    .tile-page { margin: 0; box-shadow: none; break-after: page; page-break-after: always; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #tiles .tile-page:last-child { break-after: auto; page-break-after: auto; }
    .sheet { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet.letter.wide { width: 10.4in; height: 7.9in; aspect-ratio: auto; }
    .sheet.letter.tall { width: 7.9in; height: 10.4in; aspect-ratio: auto; }
    /* poster: fill whatever paper you chose in the print dialog */
    .sheet.poster.wide, .sheet.poster.tall { width: 100%; height: 97vh; aspect-ratio: auto; }
  }
</style>
</head>
<body>
<div class="bar">
  <a href="./?tab=bracket">⬅ Back</a>
  <div class="group" id="size"><b>SIZE</b><button data-v="letter" class="on">📄 Letter</button><button data-v="poster">🖼️ Poster (any size)</button><button data-v="custom">📐 One big sheet</button><button data-v="tiles">🧩 Big poster on Letter sheets</button>
    <span id="custom-dims" style="display:none;align-items:center;gap:4px"><input id="cw" type="number" min="8" max="200" step="0.5" style="width:62px;font:inherit;border-radius:8px;border:none;padding:6px"> × <input id="ch" type="number" min="8" max="200" step="0.5" style="width:62px;font:inherit;border-radius:8px;border:none;padding:6px"> in</span></div>
  <div class="group" id="layout"><b>SHAPE</b><button data-v="wide" class="on">▭ Wide</button><button data-v="tall">▯ Tall</button></div>
  <div class="group" id="mode"><b>FILL</b><button data-v="blank" class="on">✏️ Blank to color in</button><button data-v="results">⚾ Real results so far</button><button data-v="picks">⭐ Someone's picks</button></div>
  <select id="player" style="display:none"></select>
  <div class="group" id="extra"><b>PAGE 2</b><button data-v="yes" class="on">📋 Schedule, map &amp; facts</button><button data-v="no">None</button></div>
  <button class="go" onclick="window.print()">🖨️ Print</button>
  <div class="tip" id="tip"></div>
</div>
<div class="stage"><div id="tiles" style="display:none"></div><div class="sheet letter wide" id="sheet"></div><div class="sheet letter wide page2" id="sheet2"></div></div>
<script src="mlb-data.js?v=20260929a"></script>
<script src="mlb-espn.js?v=20260929a"></script>
<script src="mlb-facts.js?v=20260929a"></script>
<script src="mlb-map.js?v=20260929a"></script>
<script src="print.js?v=20260929a"></script>
<script>
(function () {
  var st = { size: "letter", layout: "wide", mode: "blank", player: null, extra: "yes", w: 49, h: 33 };
  var MARGIN = 0.5; // inches, custom size
  var feed = null, store = null;
  try { store = JSON.parse(localStorage.getItem("mlb26")); } catch (e) {}
  var qs = new URLSearchParams(location.search);
  ["size", "layout", "mode", "extra"].forEach(function (k) { if (qs.get(k)) st[k] = qs.get(k); });
  if (+qs.get("w") > 0) st.w = +qs.get("w");
  if (+qs.get("h") > 0) st.h = +qs.get("h");
  var cwIn = document.getElementById("cw"), chIn = document.getElementById("ch");
  cwIn.value = st.w; chIn.value = st.h;
  cwIn.oninput = chIn.oninput = function () { if (+cwIn.value >= 8 && +chIn.value >= 8) { st.w = +cwIn.value; st.h = +chIn.value; render(); } };

  var sel = document.getElementById("player");
  if (store && store.players) {
    store.players.forEach(function (p) { var o = document.createElement("option"); o.value = p.id; o.textContent = p.emoji + " " + p.name; sel.appendChild(o); });
    st.player = store.active || (store.players[0] && store.players[0].id);
    sel.value = st.player;
  }
  sel.onchange = function () { st.player = sel.value; render(); };

  ["size", "layout", "mode", "extra"].forEach(function (k) {
    var g = document.getElementById(k);
    g.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () { st[k] = b.dataset.v; render(); };
    });
  });

  var here = location.host + location.pathname.replace(/print\.html$/, "");
  function render() {
    ["size", "layout", "mode", "extra"].forEach(function (k) {
      document.getElementById(k).querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === st[k]); });
    });
    sel.style.display = st.mode === "picks" ? "" : "none";
    // Letter: we fix the paper. Poster: we leave the paper size to the print dialog.
    var big = st.size === "custom" || st.size === "tiles";
    document.getElementById("custom-dims").style.display = big ? "inline-flex" : "none";
    document.getElementById("tiles").style.display = st.size === "tiles" ? "" : "none";
    document.getElementById("sheet").style.display = st.size === "tiles" ? "none" : "";
    var cW = st.w - 2 * MARGIN, cH = st.h - 2 * MARGIN;
    // custom: the page IS the paper; the sheet fills it exactly and the layout takes its shape
    document.getElementById("custom-style").textContent = !big ? "" :
      ".sheet.custom { width: min(96vw, 1400px); aspect-ratio: " + cW + " / " + cH + "; } " +
      ".sheet.tiles.page2 { width: min(96vw, 1100px); aspect-ratio: 11 / 8.5; } @media print { .sheet.tiles.page2 { width: 10.4in; height: 7.9in; margin: 0.3in auto 0; aspect-ratio: auto; } } " +
      "@media print { .sheet.custom { width: " + cW + "in; height: " + (cH - 0.02) + "in; aspect-ratio: auto; } }";
    var aspect = st.size === "custom" ? cW / cH : 0;   // tiles: the tiler sets its own; its page 2 is plain Letter
    document.getElementById("page-style").textContent = st.size === "tiles"
      ? "@page { size: letter landscape; margin: 0; }"
      : st.size === "custom"
      ? "@page { size: " + st.w + "in " + st.h + "in; margin: " + MARGIN + "in; }"
      : st.size === "letter"
      ? "@page { size: letter " + (st.layout === "tall" ? "portrait" : "landscape") + "; margin: 0.3in; }"
      : "@page { margin: 0.4in; }";
    var TG = window.MLBPrint.tileGrid(st.w, st.h);
    document.getElementById("tip").innerHTML = st.size === "tiles"
      ? "🧩 <b>" + (TG.cols * TG.rows) + " Letter sheets</b> (" + TG.cols + " across × " + TG.rows + " down) + 1 guide page = a <b>" + st.w + " × " + st.h + " in</b> poster. In the print dialog: <b>Paper: Letter</b>, <b>Layout: Landscape</b>, <b>Margins: None</b> (or Default), <b>Scale: 100 / Actual size</b>, <b>Background graphics: on</b>."
      : st.size === "custom"
      ? "📐 Page is exactly <b>" + st.w + " × " + st.h + " in</b> (½-inch margins). Click Print, choose <b>Save as PDF</b>, leave Margins and Scale on <b>Default</b>, and send the PDF to your print shop. It's all vector lines and text, so it's sharp at any size."
      : st.size === "letter"
      ? "📄 Prints on regular 8½×11 paper, " + (st.layout === "tall" ? "portrait" : "landscape") + ". Turn on <b>Background graphics</b> for team colors."
      : "🖼️ In the print preview, pick your <b>paper size</b> (or a custom size), set <b>Margins: Default</b> and <b>Scale: Default</b>, and choose " + (st.layout === "tall" ? "<b>Portrait</b>" : "<b>Landscape</b>") + ". The bracket is drawn with vector lines, so it stays sharp at any size. For a monster poster, <b>Save as PDF</b> and send that to a print shop.";
    var res = window.MLB.resolve(feed);
    var picks = (store && store.picks && st.player && store.picks[st.player]) || {};
    var who = store && store.players && store.players.filter(function (p) { return p.id === st.player; })[0];
    var subtitle = st.mode === "picks" ? (who ? who.emoji + " " + who.name + "'s picks · ★ = picked to win" : "Your picks")
      : "Color in a ⚾ dot every time a team wins. Fill ALL your dots first, and you move on!";
    var sheet = document.getElementById("sheet");
    sheet.className = "sheet " + st.size + " " + st.layout;
    sheet.innerHTML = window.MLBPrint.build(res, { aspect: aspect,
      layout: st.layout, mode: st.mode, picks: picks, season: (feed && feed.season) || 2026, subtitle: subtitle,
      footer: st.mode === "results" && feed && feed.updated ? "Results as of " + new Date(feed.updated).toLocaleString("en-US") + " · " + here : here,
    });
    if (st.size === "tiles") {
      var T = window.MLBPrint.tiles(res, { w: st.w, h: st.h, layout: "wide", mode: st.mode, picks: picks, season: (feed && feed.season) || 2026, subtitle: subtitle,
        footer: st.mode === "results" && feed && feed.updated ? "Results as of " + new Date(feed.updated).toLocaleString("en-US") + " · " + here : here });
      document.getElementById("tiles").innerHTML = T.html;
    }
    var s2 = document.getElementById("sheet2");
    s2.className = "sheet " + st.size + " " + st.layout + " page2";
    s2.style.display = st.extra === "yes" ? "" : "none";
    if (st.extra === "yes") s2.innerHTML = window.MLBPrint.page2(res, { layout: st.layout, mode: st.mode, aspect: aspect });
    var u = new URL(location.href); u.searchParams.set("extra", st.extra); u.searchParams.set("size", st.size); u.searchParams.set("layout", st.layout); u.searchParams.set("mode", st.mode);
    if (big) { u.searchParams.set("w", st.w); u.searchParams.set("h", st.h); } else { u.searchParams.delete("w"); u.searchParams.delete("h"); }
    history.replaceState(null, "", u);
  }
  render();
  var feedUrl = /^[\w\-\/]+\.json$/.test(qs.get("feed") || "") ? qs.get("feed") : "live.json";
  fetch(feedUrl, { cache: "no-store" }).then(function (r) { if (!r.ok) throw r.status; return r.json(); })
    .catch(function () { return window.MLBESPN.buildFeed(2026); })
    .then(function (d) { if (d) { feed = d; window.__FEED = d; render(); } }).catch(function () {});
})();
</script>
</body>
</html>
